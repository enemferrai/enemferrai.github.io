<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu ENEM</title><meta name="description" content="Planejador de estudos para o ENEM">
<meta name="theme-color" content="#5A3E9E"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Meu ENEM">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700;800&display=swap"><style>:root{padding-top:env(safe-area-inset-top,0px)}/* Layout: app shell — sidebar on tablet landscape / desktop, bottom tab bar on phone & portrait.
   Identity: deep violet + lilac neutrals + the gold star from the approved icon. */
:root{
  --bg:#F6F3FB; --surface:#FFFFFF; --surface-2:#EEE9F7; --ink:#221A35; --muted:#6A6380; --line:#E1DAEE;
  --accent:#5A3E9E; --accent-ink:#FFFFFF; --accent-soft:#E6DDF7; --gold:#D99A2B; --gold-soft:#FBEFD6;
  --good:#23845A; --good-soft:#DDF1E7; --warn:#B7790E; --warn-soft:#FBEED3; --bad:#C2443B; --bad-soft:#F9E0DD;
  --lc:#3A68CF; --ch:#C47F14; --cn:#23845A; --mt:#C93F5A; --rd:#7E52CF;
  --shadow:0 1px 2px rgba(40,25,80,.06),0 4px 16px rgba(40,25,80,.06);
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141020; --surface:#1D172C; --surface-2:#272038; --ink:#F0EBFA; --muted:#A69EBB; --line:#342B4A;
  --accent:#B49BF4; --accent-ink:#1A1329; --accent-soft:#2D2450; --gold:#F0C064; --gold-soft:#3A2F1A;
  --good:#5CC995; --good-soft:#163527; --warn:#E9B44C; --warn-soft:#3A2D12; --bad:#F07F75; --bad-soft:#3D1D1B;
  --lc:#7EA2F2; --ch:#E9AE52; --cn:#5CC995; --mt:#F07F96; --rd:#B59AF2;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141020; --surface:#1D172C; --surface-2:#272038; --ink:#F0EBFA; --muted:#A69EBB; --line:#342B4A;
  --accent:#B49BF4; --accent-ink:#1A1329; --accent-soft:#2D2450; --gold:#F0C064; --gold-soft:#3A2F1A;
  --good:#5CC995; --good-soft:#163527; --warn:#E9B44C; --warn-soft:#3A2D12; --bad:#F07F75; --bad-soft:#3D1D1B;
  --lc:#7EA2F2; --ch:#E9AE52; --cn:#5CC995; --mt:#F07F96; --rd:#B59AF2;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.02rem;font-weight:650}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:650}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Shell */
.app{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;padding-block:12px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.brand svg{width:34px;height:34px;border-radius:10px;flex:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;border-radius:12px;color:var(--muted);font-size:.72rem;font-weight:600;cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] .ico-bg{background:var(--accent-soft)}
.ico-bg{display:grid;place-items:center;width:52px;height:30px;border-radius:15px}
.badge{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 5px;font-weight:700}
@media (min-width:900px){
  .app{grid-template-columns:248px 1fr}
  .side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;background:var(--surface);border-right:1px solid var(--line)}
  .side .brand{padding:0 8px 18px}
  .nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font-weight:550;position:relative}
  .nav svg{width:20px;height:20px;color:var(--muted)}
  .nav:hover{background:var(--surface-2)}
  .nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .nav[aria-current="page"] svg{color:var(--accent)}
  .nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;font-size:.72rem;padding:1px 7px;font-weight:700}
  .side .sep{height:1px;background:var(--line);margin:10px 8px}
  .tabbar{display:none}
  .main{padding-block:26px 40px}
  .topbar .brand{display:none}
}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.stack.tight{gap:6px}
.grow{flex:1;min-width:0}
.divider{height:1px;background:var(--line)}

/* Buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:650;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.big{min-height:58px;font-size:1.08rem;border-radius:18px;padding:12px 24px}
.btn.sm{min-height:36px;padding:6px 12px;border-radius:10px;font-size:.88rem}
.btn.block{width:100%}
.btn svg{width:20px;height:20px}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:20px;height:20px}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
textarea.input{min-height:80px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:40px;height:40px;border:0;background:var(--surface-2);cursor:pointer;font-size:1.2rem;font-weight:700;color:var(--ink)}
.stepper span{min-width:70px;text-align:center;font-weight:650;font-variant-numeric:tabular-nums}

/* Dots, pills, bars */
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--c,var(--accent))}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.bar{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:5px;background:var(--c,var(--accent))}
.bar.thin{height:6px}

/* Home */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero h1{font-size:1.6rem}
.hero .sub{opacity:.85}
.count-box{text-align:center;background:rgba(255,255,255,.14);border-radius:18px;padding:10px 16px;min-width:96px}
:root[data-theme="dark"] .count-box{background:rgba(0,0,0,.12)}
.count-box b{display:block;font-family:var(--f-display);font-size:2.3rem;line-height:1;font-variant-numeric:tabular-nums}
.hero .star{position:absolute;right:-30px;top:-34px;width:150px;opacity:.12;pointer-events:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.stat b{font-family:var(--f-display);font-size:1.55rem;font-variant-numeric:tabular-nums;line-height:1.1}
.ring{width:64px;height:64px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bgc{stroke:var(--surface-2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .5s}
.ring text{fill:var(--ink);font-size:15px;font-weight:700;font-family:var(--f-body)}
.block-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--surface-2)}
.block-item.done{opacity:.6}
.block-item.done .bi-title{text-decoration:line-through}
.block-item .bi-title{font-weight:650}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check svg{width:16px;height:16px}

/* Timer */
.timer-face{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.timer-ring{width:min(76vw,300px);aspect-ratio:1;max-width:100%;position:relative}
.timer-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer-ring circle{fill:none;stroke-width:10}
.timer-ring .bgc{stroke:var(--surface-2)}
.timer-ring .fg{stroke:var(--c,var(--accent));stroke-linecap:round}
.timer-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.timer-digits{font-family:var(--f-display);font-size:clamp(2.6rem,11vw,3.6rem);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer-controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* Lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.subj-head{display:flex;align-items:center;gap:12px;cursor:pointer;border:0;background:none;width:100%;text-align:left;padding:0;color:var(--ink)}
.chev{transition:transform .2s;color:var(--muted);width:20px;height:20px;flex:none}
details[open] .chev{transform:rotate(90deg)}
details > summary{list-style:none;cursor:pointer}
details > summary::-webkit-details-marker{display:none}
.topic-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.topic-row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.seen-btn{width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:#fff}
.seen-btn.on{background:var(--good);border-color:var(--good)}
.seen-btn svg{width:18px;height:18px}
.hot{color:var(--gold);font-size:.8rem;font-weight:800}

/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .goal-l{stroke:var(--gold);stroke-width:2;stroke-dasharray:5 4}
.chart .bar-r{fill:var(--accent)}
.chart .bar-r.dim{fill:var(--accent-soft)}
.chart .val{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.heat{display:grid;grid-template-columns:auto repeat(var(--w),1fr);gap:4px;align-items:center}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface-2);display:block;min-width:0}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
.heat i[data-l="3"]{background:color-mix(in srgb,var(--accent) 80%,var(--surface-2))}
.heat i[data-l="4"]{background:var(--accent)}
.heat i.future{background:transparent}
.heat .lbl{font-size:.68rem;color:var(--muted);padding-right:4px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-weight:600;font-size:.85rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(15,8,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px}}
.sheet .handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-8px auto 0}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;animation:up .2s}
.toast button{background:none;border:0;color:var(--gold);font-weight:800;cursor:pointer}
@media (min-width:900px){.toast{bottom:28px}}

/* Letter */
.letter{max-width:620px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;font-size:1.08rem;line-height:1.65}
.letter h1{font-size:1.9rem}
.letter .sign{font-family:var(--f-display);font-size:1.3rem;font-weight:700}
.letter .heart{color:var(--mt)}
.letter blockquote{margin:0;padding:14px 18px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-family:var(--f-display);font-size:1.15rem;line-height:1.4}

/* Onboarding */
.onb{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:10px}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}
.level-row{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.level-row .chips .chip{flex:1;min-width:0;padding:8px 6px;font-size:.78rem}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--gold-soft);color:var(--ink);flex-wrap:wrap}
.banner b{color:var(--gold)}
.empty{padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.comp-grid{display:grid;gap:10px}
.comp{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.comp .chips .chip{flex:1;min-width:0;padding:6px 4px;min-height:36px;font-size:.82rem}
.kpi-inline{display:flex;gap:18px;flex-wrap:wrap}
.kpi-inline div{display:flex;flex-direction:column}
.kpi-inline b{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hello{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:8px 4px}
.fish{width:150px;height:auto;overflow:visible}
.fish-body{animation:swim 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bub{animation:bub 2.4s ease-in infinite;opacity:0}
.b2{animation-delay:.8s}
@keyframes swim{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(-8px,-5px) rotate(2deg)}}
@keyframes bub{0%{opacity:0;transform:translate(0,10px)}30%{opacity:1}100%{opacity:0;transform:translate(-6px,-24px)}}
.hello-msg{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.3;text-wrap:balance;max-width:28ch}
@media (max-width:600px){#taskForm{grid-template-columns:1fr 1fr!important}#taskForm label:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.fish-body,.bub{animation:none!important;opacity:1}}
.lock{max-width:360px;margin:6vh auto 0;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.lock .brand{margin-bottom:6px}
.pin-dots{display:flex;gap:16px}
.pin-dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);display:block}
.pin-dots i.on{background:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.keypad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:650;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
.keypad button:active{background:var(--accent-soft)}

function suggestedGoals() {
  const total = weekTotalAvail();
  const D = S.dream, aw = a => D.useW ? (D.w[a] || 1) : 1;
  const ws = S.subjects.map(s => ({ id: s.id, w: s.q / s.level * aw(s.area) }));
  const W = sum(ws.map(x => x.w)) || 1;
  const out = {};
  ws.forEach(x => { out[x.id] = Math.round(x.w / W * total / 15) * 15; });
  return out;
}

function todayPlan() {

  const avail = S.profile.dayMin[dateOf(t).getDay()] || 0;
  const studiedBefore = weekMinutes(ws, t);
  // dias de estudo restantes na semana (incluindo hoje)
  let daysLeft = 0;
  for (let k = t; k <= addDays(ws, 6); k = addDays(k, 1)) if (S.profile.dayMin[dateOf(k).getDay()] > 0) daysLeft++;
  daysLeft = Math.max(1, daysLeft);
  const blocks = [];
  let left = avail;
  const due = dueReviews().length;
  if (due > 0 && left >= 30) { const m = clamp(due * 5, 15, 30); blocks.push({ kind: 'rev', min: m }); left -= m; }
  const alloc = {};
  const need = id => (g[id] - (studiedBefore[id] || 0)) / daysLeft * 1.6 - (alloc[id] || 0);
  const blockLen = avail <= 60 ? 25 : 50;
  let guard = 0;
  while (left >= 20 && guard++ < 12) {
    const cand = S.subjects.filter(s => g[s.id] - (studiedBefore[s.id] || 0) - (alloc[s.id] || 0) > 0)
      .sort((a, b) => need(b.id) - need(a.id) || a.order - b.order)[0];
    if (!cand) break;
    const m = Math.min(blockLen, left);
    alloc[cand.id] = (alloc[cand.id] || 0) + m;
    const last = blocks[blocks.length - 1];
    if (last && last.subjectId === cand.id) last.min += m; else blocks.push({ kind: 'sub', subjectId: cand.id, min: m });
    left -= m;

  const revDone = S.topics.filter(tp => tp.lastReview === t).length;
  blocks.forEach(b => {
    if (b.kind === 'sub') { const d = doneToday[b.subjectId] || 0; b.done = Math.min(d, b.min); doneToday[b.subjectId] = Math.max(0, d - b.min); }
    else b.done = due === 0 && revDone > 0 ? b.min : Math.min(b.min, revDone * 5);

  if (how === 'forgot') { t.stage = 0; t.next = addDays(k, R[0]); }

  else { t.stage = t.stage + 1; t.next = t.stage < R.length ? addDays(k, R[t.stage]) : null; }
}

/* ============ Gráficos SVG ============ */
function barChart(data, { goal = null, h = 180, fmt = fmtMin, highlightLast = true } = {}) {
  const W = chartW(), H = h, L = 40, R = 8, T = 18, B = 26;
  const max = Math.max(goal || 0, ...data.map(d => d.v), 30);
  const step = niceStep(max);
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / data.length;
  let g = '';
  for (let v = 0; v <= top; v += step) g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v === 0 ? '0' : fmtAxis(v)}</text>`;
  const every = Math.ceil(data.length / Math.max(3, Math.floor(W / 80)));
  data.forEach((d, i) => {
    const x = L + i * bw + bw * .18, w = bw * .64, yy = y(d.v);
    const last = highlightLast && i === data.length - 1;
    g += `<rect class="bar-r ${last ? '' : 'dim'}" x="${x}" y="${yy}" width="${w}" height="${Math.max(0, H - B - yy)}" rx="4"><title>${esc(d.label)}: ${fmt(d.v)}</title></rect>`;
    if (i % every === 0 || i === data.length - 1) g += `<text class="ax" x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>`;
    if (last && d.v > 0) g += `<text class="val" x="${x + w / 2}" y="${yy - 5}" text-anchor="middle">${fmt(d.v)}</text>`;
  });
  if (goal) g += `<line class="goal-l" x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function niceStep(max) { const raw = max / 4; for (const m of [15, 30, 60, 120, 180, 240, 300, 360, 480, 600, 900, 1200]) if (m >= raw) return m; return Math.ceil(raw / 600) * 600; }
function chartW() { const w = Math.min(window.innerWidth, 1240) - (window.innerWidth >= 900 ? 330 : 64); return clamp(Math.round(w), 300, 900); }
function fmtAxis(v) { return v >= 60 ? (v % 60 ? (v / 60).toFixed(1).replace('.', ',') + 'h' : v / 60 + 'h') : v + 'm'; }
function lineChart(series, labels, { max = 100, h = 200, suffix = '%' } = {}) {
  const W = chartW(), H = h, L = 36, R = 14, T = 14, B = 26;
  const n = labels.length;
  const x = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1);
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v)}</text>`; }
  const every = Math.ceil(n / Math.max(3, Math.floor(W / 80)));
  labels.forEach((l, i) => { if (i % every === 0 || i === n - 1) g += `<text class="ax" x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`; });
  series.forEach(s => {
    const pts = s.values.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
    if (pts.length > 1) g += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" style="stroke:${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v, i) => { if (v != null) g += `<circle cx="${x(i)}" cy="${y(v)}" r="${i === s.values.length - 1 ? 5 : 3.5}" style="fill:${s.color}"><title>${esc(s.name)} · ${esc(labels[i])}: ${v}${suffix}</title></circle>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}

/* ============ Estudar (cronômetro) ============ */
const MODES = { livre: { label: 'Livre' }, p25: { label: 'Pomodoro 25/5', f: 25, b: 5 }, p50: { label: 'Foco 50/10', f: 50, b: 10 } };
function timerNow() {
  const T = S.timer, now = Date.now();
  const seg = T.running && T.segStart ? now - T.segStart : 0;
  const phaseEl = T.phaseMs + seg;
  const focus = T.focusMs + (T.phase === 'foco' ? phaseEl : 0);
  return { phaseEl, focus };
}
function vEstudar() {
  const T = S.timer, M = MODES[T.mode];
  if (!T.subjectId) T.subjectId = todayPlan().blocks.find(b => b.kind === 'sub' && b.done < b.min)?.subjectId || sortedSubjects()[0].id;
  const idle = !T.running && T.focusMs === 0 && T.phaseMs === 0;
  return { html: `
    <div class="row between"><h1>Estudar</h1><span class="pill accent">${esc(M.label)}</span></div>
    <div class="grid g2" style="align-items:start">
      <section class="card" style="--c:${subjColor(T.subjectId)}">
        <div class="timer-face">
          <div class="timer-ring"><svg viewBox="0 0 120 120"><circle class="bgc" cx="60" cy="60" r="52"/><circle class="fg" id="tArc" cx="60" cy="60" r="52" stroke-dasharray="0 400"/></svg>
            <div class="timer-center"><span class="eyebrow" id="tPhase"></span><span class="timer-digits" id="tDigits">00:00</span><span class="small muted" id="tSub"></span></div></div>
          <div class="timer-controls" id="tCtl"></div>
        </div>
      </section>
      <section class="card">
        <label class="field">Matéria<select class="input" id="tSubj" ${idle ? '' : ''}>${subjOptions(T.subjectId)}</select></label>
        <label class="field">Conteúdo (opcional)<select class="input" id="tTopic">${topicOptions(T.subjectId, T.topicId)}</select></label>
        <div class="stack tight"><b class="small">Modo</b>${chips('mode', Object.entries(MODES).map(([v, m]) => ({ v, label: m.label })), T.mode)}</div>
        <p class="small muted">No modo Pomodoro o app avisa com som e vibração na hora da pausa. A tela fica acesa enquanto o cronômetro roda. Se o app fechar, o tempo continua contando.</p>
        <div class="divider"></div>
        ${S.course.url ? `<a class="btn soft block" id="openClass" href="${esc(safeUrl(S.course.url))}" target="_blank" rel="noopener">${ico('ext')}Abrir aula no ${esc(S.course.name || 'cursinho')}</a><p class="small muted">Se o cronômetro estiver parado, ele começa sozinho quando você abre a aula.</p>` : ''}
        <button class="btn block" data-act="log-manual">${ico('plus')}Esqueci de ligar o cronômetro</button>
      </section>
    </div>`, mount: r => {
      bindChips(r, (n, v) => { if (n === 'mode') { if (!idle && T.mode !== v) { toast('Para trocar o modo, termine ou zere o cronômetro.'); render(); return; } T.mode = v; save(); render(); } });
      r.querySelector('#tSubj').onchange = e => { T.subjectId = e.target.value; T.topicId = null; save(); render(); };
      r.querySelector('#tTopic').onchange = e => { T.topicId = e.target.value || null; save(); };
      r.querySelector('#openClass') && (r.querySelector('#openClass').onclick = () => { if (!T.running && T.phase === 'foco') { T.running = true; T.segStart = Date.now(); save(true); setWake(true); drawTimer(true); } });
      drawTimer(true);
    } };
}
let wakeLock = null;
async function setWake(on) {
  try { if (on && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (S.timer.running) setWake(true); tick(); } });
let audioCtx = null;
function beep(times = 3) {
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    for (let i = 0; i < times; i++) { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination); const t0 = audioCtx.currentTime + i * .35; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.3, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + .25); o.start(t0); o.stop(t0 + .3); } } catch {}
  try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch {}
}
function tick() {
  const T = S.timer, M = MODES[T.mode];
  if (T.running && M.f) {
    const { phaseEl } = timerNow();
    if (T.phase === 'foco' && phaseEl >= M.f * 60000) {
      T.focusMs += M.f * 60000; T.phase = 'pausa'; T.phaseMs = 0; T.segStart = Date.now(); save(true);
      beep(); toast(`Hora da pausa de ${M.b} minutos. Levante, beba água.`);
    } else if (T.phase === 'pausa' && phaseEl >= M.b * 60000) {
      T.phase = 'foco'; T.phaseMs = 0; T.running = false; T.segStart = null; save(true); setWake(false);
      beep(2); toast('Pausa terminou. Toque em continuar quando estiver pronta.');
    }
  }
  if (route === 'estudar') drawTimer();
}
setInterval(tick, 1000);
function drawTimer(full) {
  const T = S.timer, M = MODES[T.mode], el = $('#tDigits'); if (!el) return;
  const { phaseEl, focus } = timerNow();
  let shown, frac, phaseLabel, sub;
  if (M.f) {
    const len = (T.phase === 'foco' ? M.f : M.b) * 60000;
    const rem = Math.max(0, len - phaseEl);
    shown = rem; frac = phaseEl / len;
    phaseLabel = T.phase === 'foco' ? 'Foco' : 'Pausa';
    sub = `Total estudado: ${fmtClock(focus)}`;
  } else { shown = focus; frac = (focus % 3600000) / 3600000; phaseLabel = 'Tempo de estudo'; sub = esc(subjName(T.subjectId)); }
  el.textContent = fmtClock(shown);
  $('#tPhase').textContent = phaseLabel; $('#tSub').innerHTML = sub;
  const c = 2 * Math.PI * 52; $('#tArc').setAttribute('stroke-dasharray', `${c * clamp(frac, 0, 1)} ${c}`);
  $('#tArc').style.stroke = T.phase === 'pausa' ? 'var(--gold)' : '';
  const state = T.running ? (T.phase === 'pausa' ? 'pausa' : 'run') : (focus > 0 || T.phaseMs > 0 ? 'paused' : 'idle');
  const ctl = $('#tCtl');
  if (full || ctl.dataset.s !== state) {
    ctl.dataset.s = state;
    ctl.innerHTML = state === 'idle' ? `<button class="btn primary big" id="tStart">${ico('play')}Começar</button>`
      : state === 'run' ? `<button class="btn big" id="tPause">${ico('pause')}Pausar</button><button class="btn primary big" id="tStop">${ico('check')}Terminar</button>`
      : state === 'pausa' ? `<button class="btn big" id="tSkip">Pular pausa</button><button class="btn primary big" id="tStop">${ico('check')}Terminar</button>`
      : `<button class="btn primary big" id="tStart">${ico('play')}Continuar</button><button class="btn big" id="tStop">${ico('check')}Terminar</button><button class="btn ghost" id="tReset">Zerar</button>`;
    ctl.querySelector('#tStart') && (ctl.querySelector('#tStart').onclick = () => { T.running = true; T.segStart = Date.now(); if (T.phase === 'pausa') { T.phase = 'foco'; T.phaseMs = 0; } save(true); setWake(true); beep(0); drawTimer(true); });
    ctl.querySelector('#tPause') && (ctl.querySelector('#tPause').onclick = () => { T.phaseMs += Date.now() - T.segStart; T.running = false; T.segStart = null; save(true); setWake(false); drawTimer(true); });
    ctl.querySelector('#tSkip') && (ctl.querySelector('#tSkip').onclick = () => { T.phase = 'foco'; T.phaseMs = 0; T.segStart = Date.now(); save(true); drawTimer(true); });
    ctl.querySelector('#tReset') && (ctl.querySelector('#tReset').onclick = () => confirmBox('Zerar o cronômetro?', 'O tempo marcado agora será descartado.', 'Zerar', () => { resetTimer(); render(); }));
    ctl.querySelector('#tStop') && (ctl.querySelector('#tStop').onclick = () => {
      if (T.running) { T.phaseMs += Date.now() - T.segStart; T.running = false; T.segStart = null; }
      setWake(false); save(true);
      const mins = Math.round(timerNow().focus / 60000);

    });
  }
}
function fmtClock(ms) { const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return h ? `${h}:${pad(m)}:${pad(ss)}` : `${pad(m)}:${pad(ss)}`; }

/* ============ Minha semana (plano) ============ */

function topicRow(t) {

  return `<div class="topic-row"><button class="seen-btn ${t.seen ? 'on' : ''}" data-seen="${t.id}" aria-label="${t.seen ? 'Desmarcar' : 'Marcar como estudado'}" aria-pressed="${t.seen}">${t.seen ? ico('check') : ''}</button>
    <button class="t" data-topic="${t.id}" style="border:0;background:none;text-align:left;padding:4px 0;cursor:pointer;color:var(--ink);font-weight:550">${t.hot ? '<span class="hot">★</span> ' : ''}${esc(t.title)}</button>
    ${ap != null ? `<span class="pill ${accClass(ap)} num">${ap}%</span>` : ''}${rev}</div>`;
}
function openTopicSheet(id) {
  const t = topic(id), st = topicStats(id), R = S.profile.reviewDays;
  const sess = S.sessions.filter(x => x.topicId === id);
  const errs = S.errors.filter(x => x.topicId === id);
  sheet(`<div class="row between"><div class="stack tight"><span class="eyebrow">${esc(subjName(t.subjectId))}</span><h2>${esc(t.title)}</h2></div><button class="icon-btn" data-close aria-label="Fechar">${ico('x')}</button></div>
    <div class="kpi-inline"><div><span class="small muted">Tempo</span><b>${fmtMin(sum(sess.map(x => x.min)))}</b></div><div><span class="small muted">Questões</span><b>${st.total}</b></div><div><span class="small muted">Acertos</span><b>${st.total ? pct(st.ok, st.total) + '%' : '—'}</b></div><div><span class="small muted">Erros anotados</span><b>${errs.length}</b></div></div>
    ${t.seen ? `<div class="card flat"><b>Revisões</b><div class="chips">${R.map((d, i) => `<span class="pill ${i < t.stage ? 'good' : i === t.stage && t.next ? 'accent' : ''}">${d} ${d === 1 ? 'dia' : 'dias'}</span>`).join('')}</div><p class="small muted">${t.next ? `Próxima: ${fmtDate(t.next)}` : 'Todas as revisões feitas. Conteúdo dominado!'} · Estudado em ${fmtDate(t.seenDate)}</p></div>` : '<p class="muted small">Ainda não marcado como estudado.</p>'}
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><button class="btn primary" id="tsStudy">${ico('play')}Estudar agora</button><button class="btn" id="tsQ">${ico('target')}Registrar questões</button></div>
    <div class="row between"><button class="btn ghost" id="tsRen">${ico('edit')}Renomear</button>${t.custom ? `<button class="btn ghost danger" id="tsDel">${ico('trash')}Excluir</button>` : ''}</div>`, sh => {
    sh.querySelector('#tsStudy').onclick = () => { if (!S.timer.running && S.timer.focusMs === 0) { S.timer.subjectId = t.subjectId; S.timer.topicId = t.id; save(); } closeSheet(); go('estudar'); };
    sh.querySelector('#tsQ').onclick = () => openQSheet({ subjectId: t.subjectId, topicId: t.id });
    sh.querySelector('#tsRen').onclick = () => sheet(`<h2>Renomear conteúdo</h2><input class="input" id="rn" value="${esc(t.title)}" maxlength="120" autofocus><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancelar</button><button class="btn primary" id="rnOk">Salvar</button></div>`,
      s2 => s2.querySelector('#rnOk').onclick = () => { const v = s2.querySelector('#rn').value.trim(); if (v) { t.title = v; save(); } closeSheet(); keepScroll(render); });
    sh.querySelector('#tsDel') && (sh.querySelector('#tsDel').onclick = () => confirmBox('Excluir conteúdo?', `"${t.title}" sai da lista. Sessões e questões já registradas continuam no histórico.`, 'Excluir', () => { S.topics = S.topics.filter(x => x.id !== id); save(); keepScroll(render); }));
  });
}

/* ============ Questões, simulados e erros ============ */

}

/* ============ Redação ============ */
const COMPS = ['Norma culta', 'Tema e repertório', 'Argumentação', 'Coesão', 'Proposta de intervenção'];
function vRedacao() {
  const pend = S.essays.filter(e => !e.c);
  const es = S.essays.filter(e => e.c).sort((a, b) => a.date.localeCompare(b.date));
  const totals = es.map(e => sum(e.c));
  const avg = i => es.length ? Math.round(sum(es.slice(-3).map(e => e.c[i])) / Math.min(3, es.length)) : null;
  const weakest = es.length ? COMPS.map((n, i) => ({ n, i, v: avg(i) })).sort((a, b) => a.v - b.v)[0] : null;
  return { html: `
    <div class="row between"><div class="stack tight"><h1>Redação</h1><p class="muted">Cada redação vale até 1000 pontos, 200 por competência.</p></div><button class="btn primary" id="addEs">${ico('plus')}Nova redação</button></div>

/* ============ Evolução ============ */
function vEvolucao() {
  const t = today(), ws = weekStartOf(t), g = goals(), weekGoal = sum(Object.values(g));
  let chart;
  if (ui.evoRange === 'semanas') {
    const data = []; for (let i = 11; i >= 0; i--) { const s = addDays(ws, -7 * i); data.push({ label: fmtDate(s), v: minutesBetween(s, addDays(s, 6)) }); }
    chart = barChart(data, { goal: weekGoal });
  } else {
    const data = []; for (let i = 13; i >= 0; i--) { const d = addDays(t, -i); data.push({ label: WD_SHORT[dateOf(d).getDay()] + ' ' + dateOf(d).getDate(), v: minutesBetween(d, d) }); }
    chart = barChart(data, { h: 170 });
  }
  const totalMin = minutesBetween('0000', '9999');
  const totalQ = sum(S.qlogs.map(q => q.total)), totalO = sum(S.qlogs.map(q => q.ok));
  const seen = S.topics.filter(x => x.seen).length;
  // heatmap 16 semanas
  const W = 16, start = addDays(ws, -7 * (W - 1));
  const byDay = {}; S.sessions.forEach(x => byDay[x.date] = (byDay[x.date] || 0) + x.min);
  let heat = '';
  for (let d = 0; d < 7; d++) {
    heat += `<span class="lbl">${d % 2 === 0 ? WD_SHORT[(d + 1) % 7] : ''}</span>`;
    for (let w = 0; w < W; w++) { const k = addDays(start, w * 7 + d); const m = byDay[k] || 0; const l = m === 0 ? 0 : m < 30 ? 1 : m < 60 ? 2 : m < 120 ? 3 : 4; heat += `<i ${k > t ? 'class="future"' : `data-l="${l}"`} title="${fmtDate(k)}: ${fmtMin(m)}"></i>`; }
  }
  const allSubj = sortedSubjects().map(s => ({ s, total: minutesBetween('0000', '9999', s.id), goalTotal: g[s.id] * Math.max(1, Math.ceil((diffDays(S.profile.created, t) + 1) / 7)) }));
  const maxT = Math.max(1, ...allSubj.map(x => Math.max(x.total, x.goalTotal)));
  return { html: `
    <div class="stack tight"><h1>Evolução</h1><p class="muted">Seu progresso desde ${fmtDate(S.profile.created)}.</p></div>
    <div class="stats">
      <div class="stat"><span class="eyebrow">Tempo total</span><b>${fmtMin(totalMin)}</b></div>
      <div class="stat"><span class="eyebrow">Questões</span><b>${totalQ}</b><span class="small muted">${totalQ ? pct(totalO, totalQ) + '% de acertos' : 'nenhuma ainda'}</span></div>
      <div class="stat"><span class="eyebrow">Conteúdos estudados</span><b>${seen}/${S.topics.length}</b></div>
      <div class="stat"><span class="eyebrow">Recorde de sequência</span><b>${bestStreak()} dias</b></div>
    </div>
    ${insights()}
    <section class="card"><div class="row between"><h2>Horas de estudo</h2><div class="seg"><button data-range="semanas" aria-pressed="${ui.evoRange === 'semanas'}">12 semanas</button><button data-range="dias" aria-pressed="${ui.evoRange === 'dias'}">14 dias</button></div></div>
      ${chart}${ui.evoRange === 'semanas' ? `<div class="legend"><span><i class="dot"></i>Esta semana</span><span><i class="dot" style="--c:var(--accent-soft)"></i>Semanas anteriores</span><span><i style="width:16px;border-top:2px dashed var(--gold);display:inline-block"></i>Meta semanal (${fmtMin(weekGoal)})</span></div>` : ''}</section>
    <div class="grid g2">
      <section class="card"><h2>Constância</h2><div class="heat" style="--w:${W}">${heat}</div><div class="legend"><span>Menos</span>${[0, 1, 2, 3, 4].map(l => `<i style="width:12px;height:12px;border-radius:3px;display:inline-block" class="heat-k" data-k="${l}"></i>`).join('')}<span>Mais</span></div></section>
      <section class="card"><h2>Estudado × meta acumulada</h2><p class="small muted">Barra cheia: estudado. Marca dourada: meta desde o início.</p>
        ${allSubj.map(({ s, total, goalTotal }) => `<div class="stack tight"><div class="row between"><span class="small"><b>${esc(s.name)}</b></span><span class="small muted num">${fmtMin(total)} / ${fmtMin(goalTotal)}</span></div><div class="bar" style="--c:${AREAS[s.area].color}"><i style="width:${total / maxT * 100}%"></i><b style="position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px;background:var(--gold);left:calc(${Math.min(99.4, goalTotal / maxT * 100)}%)"></b></div></div>`).join('')}</section>
    </div>`, mount: r => {
      r.querySelectorAll('[data-range]').forEach(b => b.onclick = () => { ui.evoRange = b.dataset.range; keepScroll(render); });
      r.querySelectorAll('.heat-k').forEach(i => { const l = +i.dataset.k; i.style.background = ['var(--surface-2)', 'color-mix(in srgb,var(--accent) 30%,var(--surface-2))', 'color-mix(in srgb,var(--accent) 55%,var(--surface-2))', 'color-mix(in srgb,var(--accent) 80%,var(--surface-2))', 'var(--accent)'][l]; });
    } };
}
function bestStreak() {
  const days = [...new Set(S.sessions.map(x => x.date))].sort(); let best = 0, cur = 0, prev = null;
  days.forEach(d => { cur = prev && diffDays(prev, d) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; }); return best;
}
function insights() {
  const out = [], t = today(), ws = weekStartOf(t), g = goals(), wm = weekMinutes(ws);
  const acc = sortedSubjects().map(s => ({ s, st: subjectStats(s.id) })).filter(x => x.st.total >= 10).map(x => ({ ...x, p: pct(x.st.ok, x.st.total) }));
  if (acc.length) { const w = [...acc].sort((a, b) => a.p - b.p)[0], b = [...acc].sort((a, b) => b.p - a.p)[0];
    if (w.p < 60) out.push(`<b>${esc(w.s.name)}</b> está com ${w.p}% de acertos. Vale rever a teoria e anotar os erros.`);
    if (b.p >= 70 && b !== w) out.push(`Seu ponto forte é <b>${esc(b.s.name)}</b>, com ${b.p}% de acertos.`); }
  const dayIdx = (dateOf(t).getDay() + 6) % 7;
  if (dayIdx >= 3) { const late = sortedSubjects().filter(s => g[s.id] >= 30 && (wm[s.id] || 0) < g[s.id] * .3).map(s => s.name);
    if (late.length) out.push(`Ainda falta estudar nesta semana: <b>${late.slice(0, 3).map(esc).join(', ')}</b>.`); }
  const reasons = {}; S.errors.forEach(e => reasons[e.reason] = (reasons[e.reason] || 0) + 1);
  const topR = Object.entries(reasons).sort((a, b) => b[1] - a[1])[0];
  if (topR && topR[1] >= 3) out.push(`Seu motivo de erro mais comum é <b>${esc(topR[0].toLowerCase())}</b>.${topR[0] === 'Desatenção' ? ' Grife o que a questão pede antes de responder.' : topR[0] === 'Interpretação' ? ' Leia o comando da questão antes do texto.' : ''}`);
  const st = streak(); if (st.n >= 5) out.push(`Você está há <b>${st.n} dias seguidos</b> estudando. Constância vale mais que maratona.`);
  if (!out.length) return '';
  return `<section class="card flat"><h2>O que os números dizem</h2><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">${out.map(o => `<li>${o}</li>`).join('')}</ul></section>`;
}

function backupNudge() {

  const lb = S.profile.lastBackup; if (lb && diffDays(lb, today()) < 7) return '';
  return `<div class="banner"><span class="grow"><b>Faça uma cópia de segurança.</b> ${lb ? `A última foi em ${fmtDate(lb)}.` : 'Você ainda não fez nenhuma.'} Leva 5 segundos.</span><button class="btn sm primary" id="nudgeBk" onclick="exportBackup()">Fazer backup</button></div>`;

async function exportBackup() {
  const data = JSON.stringify({ app: 'meu-enem', exported: new Date().toISOString(), state: S }, null, 1);
  const name = `meu-enem-backup-${today()}.json`;
  const file = new File([data], name, { type: 'application/json' });
  let shared = false;
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Backup Meu ENEM', text: 'Backup do app Meu ENEM' }); shared = true; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  if (!shared) { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
  if (!DEMO) { S.profile.lastBackup = today(); save(true); }
  toast(shared ? 'Backup enviado.' : 'Backup salvo em Downloads.'); keepScroll(render);
}
window.exportBackup = exportBackup;
function importBackup(file) {

  };
  fr.readAsText(file);
}

      <p class="small muted">Ligado, as áreas com peso maior ganham mais tempo na sua semana.</p></section>
    <section class="card"><h2>Quanto falta para a nota de corte</h2><p class="small muted">Use as notas de um simulado que mostre a nota no formato do ENEM (de 0 a 1000), como os simulados do cursinho.</p>
      <div class="grid g3" style="gap:10px">${areas.map(a => `<label class="field">${a.n}<input class="input num" type="number" inputmode="numeric" min="0" max="1000" data-sc="${a.k}" value="${D.score[a.k] ?? ''}" placeholder="—"></label>`).join('')}
      <label class="field">Nota de corte (meta)<input class="input num" type="number" inputmode="numeric" min="0" max="1000" id="dCut" value="${D.cut ?? ''}" placeholder="Ex.: 720"></label></div>
      ${avg != null ? `<div class="kpi-inline"><div><span class="small muted">Minha média com os pesos</span><b>${avg}</b></div>${D.cut ? `<div><span class="small muted">Nota de corte</span><b>${D.cut}</b></div><div><span class="small muted">${avg >= D.cut ? 'Situação' : 'Faltam'}</span><b style="color:var(--${avg >= D.cut ? 'good' : 'warn'})">${avg >= D.cut ? 'Acima da meta!' : (D.cut - avg) + ' pontos'}</b></div>` : ''}</div>
        ${best ? `<p class="small">Onde dá para ganhar mais pontos: <b>${best.n}</b>, que tem peso ${D.w[best.k]} e mais espaço para crescer.</p>` : ''}` : '<p class="small muted">Preencha as 5 notas para ver sua média ponderada.</p>'}</section>`,
    mount: r => {
      r.querySelector('#dC').onchange = e => { const before = D.years; setDreamCourse(e.target.value); if (D.years !== before) r.querySelector('#dY').value = D.years ?? ''; };
      r.querySelector('#dSave').onclick = () => { setDreamCourse(r.querySelector('#dC').value); const y = +r.querySelector('#dY').value; D.years = y >= 1 && y <= 10 ? y : null; D.uni = r.querySelector('#dU').value.trim(); D.city = r.querySelector('#dCi').value.trim(); D.why = r.querySelector('#dW').value.trim(); save(true); render(); toast('Sonho salvo!'); };
      r.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const k = b.dataset.w; D.w[k] = clamp(D.w[k] + +b.dataset.d, 1, 5); save(); keepScroll(render); });
      r.querySelector('#dUse').onchange = e => { D.useW = e.target.checked; save(); toast(D.useW ? 'Plano ajustado aos pesos do seu curso.' : 'Plano voltou ao cálculo padrão.'); };
      r.querySelectorAll('[data-sc]').forEach(i => i.onchange = () => { const v = i.value === '' ? null : clamp(+i.value, 0, 1000); D.score[i.dataset.sc] = v; save(); keepScroll(render); });
      r.querySelector('#dCut').onchange = e => { D.cut = e.target.value === '' ? null : clamp(+e.target.value, 0, 1000); save(); keepScroll(render); };
    } };
}

/* ============ Meu cursinho ============ */
function courseDaysLeft() { const C = S.course; return C.end ? diffDays(today(), C.end) : null; }
function cursinhoToday() {
  const C = S.course; if (!C.name) return '';
  const t = today(), due = S.tasks.filter(x => !x.done && x.due && x.due <= t), dl = courseDaysLeft();
  const warn = dl != null && dl <= 15 ? `<span class="pill ${dl < 0 ? 'bad' : 'warn'}">${dl < 0 ? 'Acesso vencido' : `Acesso vence em ${dl} ${dl === 1 ? 'dia' : 'dias'}`}</span>` : '';
  if (!due.length && !warn) return '';
  return `<section class="card"><div class="row between"><h2>${esc(C.name)}</h2>${warn}</div>${due.length ? `<div class="list">${due.slice(0, 4).map(taskRow).join('')}</div>` : ''}<button class="btn sm ghost" data-go="cursinho" style="align-self:flex-start">Ver cronograma do cursinho</button></section>`;
}
function taskRow(x) {
  const t = today();
  return `<div class="li"><button class="seen-btn ${x.done ? 'on' : ''}" data-task="${x.id}" aria-label="${x.done ? 'Desmarcar' : 'Marcar como feita'}">${x.done ? ico('check') : ''}</button><span class="dot" style="--c:${subjColor(x.subjectId)}"></span>
    <div class="grow"><div class="t" style="${x.done ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(x.title)}</div><div class="small muted">${esc(subjName(x.subjectId))}${x.due ? ` · ${x.due < t && !x.done ? `<b style="color:var(--bad)">atrasada (${fmtDate(x.due)})</b>` : x.due === t ? 'hoje' : fmtDate(x.due)}` : ''}</div></div>
    <button class="icon-btn" data-deltask="${x.id}" aria-label="Excluir">${ico('trash')}</button></div>`;
}
function bindTasks(r) {
  r.querySelectorAll('[data-task]').forEach(b => b.onclick = () => {
    const x = S.tasks.find(y => y.id === b.dataset.task); x.done = !x.done; x.doneDate = x.done ? today() : null; save(); keepScroll(render);
    if (x.done) toast('Tarefa feita!', 'Registrar o tempo', () => openLogSheet({ subjectId: x.subjectId, kind: 'aula' }));
  });
  r.querySelectorAll('[data-deltask]').forEach(b => b.onclick = () => { S.tasks = S.tasks.filter(y => y.id !== b.dataset.deltask); save(); keepScroll(render); });
}
function vCursinho() {
  const C = S.course, t = today(), ws = weekStartOf(t), dl = courseDaysLeft();
  const aula = S.sessions.filter(x => x.kind === 'aula');
  const aWeek = sum(aula.filter(x => x.date >= ws).map(x => x.min)), aTot = sum(aula.map(x => x.min));
  const open = S.tasks.filter(x => !x.done).sort((a, b) => (a.due || '9').localeCompare(b.due || '9')), done = S.tasks.filter(x => x.done).sort((a, b) => (b.doneDate || '').localeCompare(a.doneDate || ''));
  const bySubj = sortedSubjects().map(s => ({ s, m: sum(aula.filter(x => x.subjectId === s.id).map(x => x.min)) })).filter(x => x.m > 0);
  const mx = Math.max(1, ...bySubj.map(x => x.m));
  const url = safeUrl(C.url);
  return { html: `<h1>Meu cursinho</h1>
    <section class="card"><div class="row between"><div class="stack tight"><span class="eyebrow">Cursinho on-line</span><h2>${esc(C.name || 'Ainda não cadastrado')}</h2>${C.plan ? `<span class="small muted">${esc(C.plan)}</span>` : ''}</div>
      ${dl != null ? `<span class="pill ${dl < 0 ? 'bad' : dl <= 15 ? 'warn' : 'good'}">${dl < 0 ? 'Acesso vencido' : `Acesso até ${fmtDate(C.end)} · ${dl} dias`}</span>` : ''}</div>
      ${url ? `<a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener">${ico('ext')}Abrir a plataforma</a>` : ''}
      <details ${C.name ? '' : 'open'}><summary class="small" style="padding:6px 0;color:var(--accent);font-weight:650">Editar dados do cursinho</summary>
        <div class="grid g2" style="padding-top:8px">
          <label class="field">Nome<input class="input" id="cN" value="${esc(C.name)}" maxlength="40" placeholder="Ex.: Professor Ferretto"></label>
          <label class="field">Plano ou turma<input class="input" id="cP" value="${esc(C.plan)}" maxlength="60" placeholder="Ex.: Extensivo ENEM"></label>
          <label class="field">Link para entrar<input class="input" id="cU" value="${esc(C.url)}" maxlength="200" placeholder="Copie o endereço da plataforma" inputmode="url"></label>
          <label class="field">Carga horária total (horas)<input class="input num" type="number" id="cH" min="0" value="${C.hours ?? ''}" placeholder="Opcional"></label>
          <label class="field">Início do acesso<input class="input" type="date" id="cS" value="${C.start}"></label>
          <label class="field">Fim do acesso<input class="input" type="date" id="cE" value="${C.end}"></label></div>
        <p class="small muted">O fim do acesso está no e-mail da compra ou na área do aluno. O app avisa 15 dias antes de vencer.</p>
        <button class="btn soft" id="cSave">Salvar</button></details></section>
    <div class="stats">
      <div class="stat"><span class="eyebrow">Aulas nesta semana</span><b>${fmtMin(aWeek)}</b></div>
      <div class="stat"><span class="eyebrow">Aulas no total</span><b>${fmtMin(aTot)}</b>${C.hours ? `<div class="bar thin"><i style="width:${clamp(aTot / 60 / C.hours * 100, 0, 100)}%"></i></div><span class="small muted">de ${C.hours}h do curso</span>` : ''}</div>
      <div class="stat"><span class="eyebrow">Tarefas feitas</span><b>${done.length}</b><span class="small muted">${open.length} pendentes</span></div>
    </div>
    <section class="card"><h2>Cronograma do cursinho</h2><p class="small muted">Copie para cá as aulas e listas da semana que o cursinho indicar. O app avisa na tela Hoje quando chegar o dia.</p>
      <div class="grid" style="grid-template-columns:2fr 1.3fr 1fr auto;gap:8px;align-items:end" id="taskForm">
        <label class="field">Tarefa<input class="input" id="tkT" maxlength="100" placeholder="Ex.: Aula 5 de Funções + lista"></label>
        <label class="field">Matéria<select class="input" id="tkS">${subjOptions()}</select></label>
        <label class="field">Para quando<input class="input" type="date" id="tkD" value="${t}"></label>
        <button class="btn primary" id="tkAdd" aria-label="Adicionar tarefa">${ico('plus')}</button></div>
      ${open.length ? `<div class="list">${open.map(taskRow).join('')}</div>` : '<div class="empty">Nenhuma tarefa pendente.</div>'}
      ${done.length ? `<details><summary class="small muted" style="padding:8px 0">Tarefas feitas (${done.length})</summary><div class="list">${done.slice(0, 40).map(taskRow).join('')}</div></details>` : ''}</section>
    ${bySubj.length ? `<section class="card"><h2>Horas de aula por matéria</h2>${bySubj.map(({ s, m }) => `<div class="row"><span class="small" style="width:150px">${esc(s.name)}</span><div class="bar grow" style="--c:${AREAS[s.area].color}"><i style="width:${m / mx * 100}%"></i></div><b class="small num" style="width:52px;text-align:right">${fmtMin(m)}</b></div>`).join('')}</section>` : ''}
    <section class="card flat"><h2>Como usar junto com o cursinho</h2><ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px">
      <li>Antes de assistir, abra a aula pela tela <b>Estudar</b>. O cronômetro começa sozinho e o tempo vai para "Aula do cursinho".</li>
      <li>Envie a redação pela plataforma e registre em <b>Redação → Enviei para correção</b>. Quando a nota sair, toque em "Lançar notas".</li>
      <li>Fez simulado na plataforma? Lance os acertos em <b>Questões e simulados</b>. Se ele mostrar notas de 0 a 1000, coloque também em <b>Meu sonho</b>.</li>
      <li>Depois de cada aula, marque o assunto em <b>Conteúdos</b> para o app agendar as revisões.</li></ul></section>`,
    mount: r => {
      r.querySelector('#cSave').onclick = () => {
        const u = r.querySelector('#cU').value.trim();
        if (u && !safeUrl(u)) { toast('Esse link não parece um endereço de site.'); return; }
        const s0 = r.querySelector('#cS').value, e0 = r.querySelector('#cE').value;
        if (s0 && e0 && e0 < s0) { toast('O fim do acesso precisa ser depois do início.'); return; }
        Object.assign(C, { name: r.querySelector('#cN').value.trim(), plan: r.querySelector('#cP').value.trim(), url: u, start: s0, end: e0, hours: +r.querySelector('#cH').value || null });
        save(true); render(); toast('Cursinho salvo.');
      };
      r.querySelector('#tkAdd').onclick = () => {
        const ti = r.querySelector('#tkT').value.trim(); if (!ti) { r.querySelector('#tkT').focus(); return; }
        S.tasks.push({ id: uid(), title: ti, subjectId: r.querySelector('#tkS').value, due: r.querySelector('#tkD').value || null, done: false });
        save(); keepScroll(render); toast('Tarefa adicionada.');
      };
      r.querySelector('#tkT').addEventListener('keydown', e => { if (e.key === 'Enter') r.querySelector('#tkAdd').click(); });
      bindTasks(r);
    } };
}

/* ============ Início ============ */
const APP_VERSION = '1.2.0';
function boot() {
  applyTheme(); dailySnapshot();
  if (S.timer.running) setWake(true);
  render();
  if (!isLocked()) afterUnlock();
  if (window.__PWA__ && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => { const nw = reg.installing; nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('Nova versão do app disponível.', 'Atualizar', () => { nw.postMessage('skip'); }); }); });
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
  }
}
boot();
</script></body></html>
